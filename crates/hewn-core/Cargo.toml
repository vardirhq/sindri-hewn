[package]
name = "hewn-core"
version = "0.1.0"
edition = "2021"
description = "Deterministic and non-destructive texture atlas generation for Sindri: Hewn"
license = "MIT OR Apache-2.0"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
