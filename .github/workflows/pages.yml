name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Hewn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm install
      - name: Build frontend and Rust WASM
        working-directory: apps/web
        env:
          GITHUB_PAGES: 'true'
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  deploy:
    name: Deploy Hewn
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in {1..12}; do
            if count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length') && [[ "$count" == "1" ]]; then
              echo "Pages artifact is available."
              exit 0
            fi
            echo "Waiting for Pages artifact (attempt $attempt/12)"
            sleep 5
          done
          echo "::error::Expected exactly one available github-pages artifact."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
